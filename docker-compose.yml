name: crm

# Les trois services partagent les mêmes volumes node_modules (même image Linux).
# Seul `api` lance `npm install` ; `web` attend que l'API soit prête, ce qui évite
# deux installations concurrentes sur le même package-lock.json.
x-node-volumes: &node-volumes
  - .:/app
  - node-modules:/app/node_modules
  - web-app-node-modules:/app/apps/web/node_modules
  - api-node-modules:/app/apps/api/node_modules
  - shared-node-modules:/app/packages/shared/node_modules

services:
  db:
    image: postgres:16-alpine
    container_name: crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: node:22-alpine
    container_name: crm-api
    working_dir: /app
    command: >
      sh -c "npm install &&
             npm run build -w @crm/shared &&
             (npm run dev -w @crm/shared &) &&
             npm run start:dev -w api"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm}@db:5432/${POSTGRES_DB:-crm}
      PORT: 3000
      # Surveillance des fichiers par polling (volumes montés sous macOS / Windows)
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    ports:
      - "${API_PORT:-3000}:3000"
    volumes: *node-volumes
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      # Laisse le temps au premier `npm install`
      start_period: 300s

  web:
    image: node:22-alpine
    container_name: crm-web
    working_dir: /app
    command: npm run dev -w web -- --host 0.0.0.0 --port 5173
    environment:
      VITE_USE_POLLING: "true"
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes: *node-volumes
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  node-modules:
  web-app-node-modules:
  api-node-modules:
  shared-node-modules:
